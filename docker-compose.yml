services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-ecommerce_db}
            POSTGRES_USER: ${DB_USER:-ecommerce_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - backend

    api:
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: production
            DB_HOST: db
            DB_PORT: 5432
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - backend

volumes:
    postgres_data:

networks:
    backend:
        driver: bridge
