name: E-Commerce Rollback

on:
    workflow_dispatch:
        inputs:
            image_tag:
                description: "Docker Hub image tag to restore"
                required: true
                type: string
                default: "sha-e63e53d732925184d7ba7c5c561c74c607b9e358"

permissions:
    contents: read

concurrency:
    group: ecommerce-production-deployment
    cancel-in-progress: false

jobs:
    rollback:
        name: Rollback API on EC2
        runs-on: ubuntu-latest

        steps:
            - name: Validate image tag
              env:
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
                    echo "Invalid image tag. Use a full SHA-tagged image."
                    exit 1
                  fi

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Roll back through AWS Systems Manager
              env:
                  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  COMMANDS=$(jq -n --arg tag "$IMAGE_TAG" '[
                    "set -e",
                    "cd /home/ubuntu/ecommerce-deployment",
                    "CURRENT_TAG=$(grep -oE \"image: vyshnavi1411/ecommerce-api:[^[:space:]]+\" docker-compose.yml | head -1 | cut -d: -f2)",
                    "echo Previous image: $CURRENT_TAG",
                    "sed -i \"s|image: vyshnavi1411/ecommerce-api:.*|image: vyshnavi1411/ecommerce-api:" + $tag + "|\" docker-compose.yml",
                    "if ! docker compose pull api; then echo Image pull failed; exit 1; fi",
                    "docker compose up -d --no-deps api",
                    "HEALTHY=0",
                    "for i in $(seq 1 30); do if curl -fsS http://localhost:3000/health; then HEALTHY=1; break; fi; sleep 5; done",
                    "if [ \"$HEALTHY\" -eq 1 ]; then echo Rollback successful; exit 0; fi",
                    "echo Rollback health check failed. Restoring previous image.",
                    "sed -i \"s|image: vyshnavi1411/ecommerce-api:.*|image: vyshnavi1411/ecommerce-api:$CURRENT_TAG|\" docker-compose.yml",
                    "docker compose pull api",
                    "docker compose up -d --no-deps api",
                    "docker compose logs --tail=50 api",
                    "exit 1"
                  ]')

                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$EC2_INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters "$(jq -n --argjson commands "$COMMANDS" '{commands: $commands}')" \
                    --query "Command.CommandId" \
                    --output text)

                  echo "SSM Command ID: $COMMAND_ID"

                  for i in $(seq 1 40); do
                    STATUS=$(aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$EC2_INSTANCE_ID" \
                      --query "Status" \
                      --output text 2>/dev/null || echo "Pending")

                    echo "Deployment status: $STATUS"

                    if [[ "$STATUS" == "Success" ]]; then
                      break
                    fi

                    if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
                      break
                    fi

                    sleep 5
                  done

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json

                  [[ "$STATUS" == "Success" ]]
