name: E-Commerce CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-and-build:
        name: Test and Build
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: ecommerce_db
                    POSTGRES_USER: ecommerce_user
                    POSTGRES_PASSWORD: ci_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ecommerce_user -d ecommerce_db"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DB_HOST: localhost
            DB_PORT: 5432
            DB_NAME: ecommerce_db
            DB_USER: ecommerce_user
            DB_PASSWORD: ci_test_password
            ADMIN_API_TOKEN: ci_test_admin_token
            NODE_ENV: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install backend dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run backend ESLint
              run: npm run lint

            - name: Initialize database
              run: |
                  PGPASSWORD=$DB_PASSWORD psql \
                    -h localhost \
                    -U $DB_USER \
                    -d $DB_NAME \
                    -f database/init.sql

            - name: Run API tests
              run: npm test

            # Frontend checks
            - name: Install frontend dependencies
              run: npm ci --prefix frontend

            - name: Run frontend ESLint
              run: npm run lint --prefix frontend

            - name: Build frontend
              run: npm run build --prefix frontend

            # Docker setup
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Backend image
            - name: Generate backend Docker image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: vyshnavi1411/ecommerce-api
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=long

            - name: Build and publish backend Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            # Frontend image
            - name: Generate frontend Docker image tags
              id: frontend-meta
              uses: docker/metadata-action@v5
              with:
                  images: vyshnavi1411/ecommerce-frontend
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=long

            - name: Build and publish frontend Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.frontend-meta.outputs.tags }}
                  labels: ${{ steps.frontend-meta.outputs.labels }}

    deploy-to-ec2:
        name: Deploy to AWS EC2
        needs: test-and-build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Deploy through AWS Systems Manager
              env:
                  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
                  IMAGE_TAG: sha-${{ github.sha }}
              run: |
                  COMMANDS=$(jq -n --arg tag "$IMAGE_TAG" '[
                    "set -e",
                    "cd /home/ubuntu/ecommerce-deployment",
                    ("sed -i \"s|image: vyshnavi1411/ecommerce-api:.*|image: vyshnavi1411/ecommerce-api:" + $tag + "|\" docker-compose.yml"),
                    ("sed -i \"s|image: vyshnavi1411/ecommerce-frontend:.*|image: vyshnavi1411/ecommerce-frontend:" + $tag + "|\" docker-compose.yml"),
                    "docker compose pull api frontend",
                    "docker compose up -d --no-deps api frontend",
                    "for i in $(seq 1 30); do if curl -fsS http://localhost:3000/health && curl -fsS http://localhost:8080/health; then exit 0; fi; sleep 5; done",
                    "echo Deployment health check failed",
                    "docker compose logs --tail=50 api frontend",
                    "exit 1"
                  ]')

                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$EC2_INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters "{\"commands\":$COMMANDS}" \
                    --query "Command.CommandId" \
                    --output text)

                  echo "SSM Command ID: $COMMAND_ID"

                  aws ssm wait command-executed \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$EC2_INSTANCE_ID"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$EC2_INSTANCE_ID" \
                    --query "{Status:Status,Output:StandardOutputContent}" \
                    --output json
