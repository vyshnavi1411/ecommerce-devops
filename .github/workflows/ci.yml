name: E-Commerce CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: ecommerce_db
                    POSTGRES_USER: ecommerce_user
                    POSTGRES_PASSWORD: ci_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ecommerce_user -d ecommerce_db"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DB_HOST: localhost
            DB_PORT: 5432
            DB_NAME: ecommerce_db
            DB_USER: ecommerce_user
            DB_PASSWORD: ci_test_password
            ADMIN_API_TOKEN: ci_test_admin_token
            NODE_ENV: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run ESLint
              run: npm run lint

            - name: Initialize database
              run: |
                  PGPASSWORD=$DB_PASSWORD psql \
                    -h localhost \
                    -U $DB_USER \
                    -d $DB_NAME \
                    -f database/init.sql

            - name: Run API tests
              run: npm test

            - name: Build Docker image
              run: docker build -t ecommerce-api:${{ github.sha }} .
